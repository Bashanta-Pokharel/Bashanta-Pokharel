<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#00C2CB">
        <animate attributeName="stop-color" values="#00C2CB;#6EE7B7;#00C2CB" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#8B5CF6;#3B82F6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
    <style><![CDATA[
      .bg { fill: url(#g1); }
      .blob { opacity:0.45; filter: url(#f1); }
      .title { font: 700 36px 'Segoe UI', Roboto, Helvetica, Arial; fill: #07122a; }
      .subtitle { font: 400 18px 'Segoe UI', Roboto, Helvetica, Arial; fill:#08304a; }
      .cta { font: 600 14px 'Segoe UI', Roboto, Helvetica, Arial; fill: white; }
      @keyframes floatA { 0% { transform: translateY(0px);} 50% { transform: translateY(-14px);} 100% { transform: translateY(0px);} }
      @keyframes floatB { 0% { transform: translateY(0px);} 50% { transform: translateY(10px);} 100% { transform: translateY(0px);} }
    ]]></style>
  </defs>

  <!-- background rounded card -->
  <rect x="20" y="20" rx="18" ry="18" width="1160" height="280" class="bg" />

  <!-- animated soft blobs -->
  <g transform="translate(60,60)">
    <g class="blob" style="animation: floatA 5s ease-in-out infinite; transform-origin: center;">
      <circle cx="80" cy="60" r="70" fill="#7DD3FC" />
    </g>
    <g class="blob" style="animation: floatB 7s ease-in-out infinite; transform-origin: center;">
      <ellipse cx="320" cy="110" rx="110" ry="65" fill="#A78BFA" />
    </g>
    <g class="blob" style="animation: floatA 6s ease-in-out infinite; transform-origin: center;">
      <circle cx="520" cy="40" r="56" fill="#34D399" />
    </g>
  </g>

  <!-- hero text -->
  <g transform="translate(260,86)">
    <text class="title">Hi, I'm <tspan style="fill:#ffffff; background:none;">Bashanta Pokharel</tspan> 👋</text>
    <text x="0" y="42" class="subtitle">Backend-focused Full Stack Engineer · APIs · Scalable Systems · Delightful Frontends</text>

    <!-- call to action pill -->
    <g transform="translate(0,78)">
      <rect x="0" y="0" rx="10" ry="10" width="170" height="36" fill="#07122a" opacity="0.9" />
      <text x="22" y="23" class="cta">View portfolio →</text>
    </g>
  </g>

  <!-- small animated bars on the right to suggest activity -->
  <g transform="translate(940,70)" opacity="0.95">
    <rect x="0" y="0" width="12" height="60" rx="6" fill="#ffffff">
      <animate attributeName="height" values="20;80;20" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="0" width="12" height="40" rx="6" fill="#ffffff">
      <animate attributeName="height" values="40;10;40" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="0" width="12" height="70" rx="6" fill="#ffffff">
      <animate attributeName="height" values="70;30;70" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- subtle highlight border stroke that glows -->
  <rect x="24" y="24" rx="16" ry="16" width="1152" height="272" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

</svg>